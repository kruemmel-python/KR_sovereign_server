[PHP]
engine = On
short_open_tag = Off
expose_php = Off
precision = 14
output_buffering = 4096
implicit_flush = Off
serialize_precision = -1
zend.exception_ignore_args = On

max_execution_time = 30
max_input_time = 30
max_input_nesting_level = 64
max_input_vars = 2000
memory_limit = 256M

error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = "F:/old_sourcecodes/sovereign_server_v9_professional/KR_sovereign_server/stack/runtime/logs/php-error.log"
ignore_repeated_errors = On

variables_order = "GPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On
post_max_size = 17M
default_mimetype = "text/html"
default_charset = "UTF-8"

doc_root = "F:/old_sourcecodes/sovereign_server_v9_professional/KR_sovereign_server/www"
user_dir =
user_ini.filename =
enable_dl = Off
cgi.force_redirect = Off
cgi.fix_pathinfo = 0
cgi.discard_path = 1
fastcgi.logging = 0

file_uploads = On
upload_tmp_dir = "F:/old_sourcecodes/sovereign_server_v9_professional/KR_sovereign_server/stack/runtime/tmp"
upload_max_filesize = 16M
max_file_uploads = 20
sys_temp_dir = "F:/old_sourcecodes/sovereign_server_v9_professional/KR_sovereign_server/stack/runtime/tmp"

allow_url_fopen = On
allow_url_include = Off
open_basedir = "F:/old_sourcecodes/sovereign_server_v9_professional/KR_sovereign_server/www;F:/old_sourcecodes/sovereign_server_v9_professional/KR_sovereign_server/stack/runtime/tmp;F:/old_sourcecodes/sovereign_server_v9_professional/KR_sovereign_server/stack/runtime/sessions"
disable_functions = "exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec"

extension_dir = "F:/old_sourcecodes/sovereign_server_v9_professional/KR_sovereign_server/stack/modules/php/8.4.27-1/ext"
extension = php_curl.dll
extension = php_exif.dll
extension = php_fileinfo.dll
extension = php_gd.dll
extension = php_intl.dll
extension = php_mbstring.dll
extension = php_mysqli.dll
extension = php_openssl.dll
extension = php_pdo_mysql.dll
extension = php_sodium.dll
extension = php_zip.dll

[Date]
date.timezone = UTC

[Session]
session.save_handler = files
session.save_path = "F:/old_sourcecodes/sovereign_server_v9_professional/KR_sovereign_server/stack/runtime/sessions"
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.cookie_secure = 0

[Assertion]
zend.assertions = -1

[opcache]
opcache.enable = 0
opcache.enable_cli = 0
